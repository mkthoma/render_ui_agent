# One blueprint, both services — for a combined repo laid out as:
#
#   <your-new-repo>/
#     render.yaml          <- this file, renamed
#     glc_v3/              <- gateway (Dockerfile already inside)
#     ui-agents/           <- runtime + UI (Dockerfile already inside)
#
# Copy this to the new repo root as `render.yaml`. Both Dockerfiles and both
# .dockerignore files come along with their folders unchanged; `rootDir` is what
# tells Render which subfolder is the build context for each service.
#
# GLC_BASE_URL below is the gateway's public onrender.com hostname, pinned as a
# literal value. `fromService: {property: hostport}` was tried first for
# automatic wiring, but its resolved "host:port" wasn't DNS-resolvable from
# the runtime container (ConnectError: Name or service not known) -- this
# account/plan doesn't appear to have private networking between the two
# services. The public hostname is a proven, verified-working fallback: one
# more network hop than a private link would be, but it actually connects.
services:
  # --- the gateway: the only place a provider credential exists ---------------
  - type: web
    name: glc-gateway
    runtime: docker
    rootDir: glc_v3
    dockerfilePath: ./Dockerfile
    # Free tier: no cost, but the service SLEEPS after ~15 min idle and takes
    # roughly 50s to wake. Hit /healthz on both services before demoing.
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GLC_HOST
        value: 0.0.0.0
      - key: LLM_ORDER
        value: gemini
      # Free-tier Gemini quota is per key AND per model. gemini-2.5-flash is
      # retired for new keys and 404s; pin one the keys can actually reach.
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Set in the Render dashboard, never in the repo. Each key becomes its own
      # independently rate-limited provider (gemini_1..N).
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_5
        sync: false

  # --- the runtime + UI: calls the gateway over HTTP, holds its own search key ----------
  - type: web
    name: s14-runtime
    runtime: docker
    rootDir: ui-agents
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    # NOT more than one. A turn is two requests — POST /v1/agent/runs then
    # GET /v1/runs/{id}/composed — and the run lives in app.state.s13_runtime.
    # Split them across instances and the second returns 404.
    numInstances: 1
    # NO DISK. Render's free instance type does not offer persistent storage, so
    # S13_DATA_DIR below writes to the container filesystem instead. Runs work
    # normally while the container lives; the graph journal and memory are LOST
    # on every restart, redeploy and wake-from-sleep. That is acceptable for a
    # demo and wrong for anything you want to keep — re-add a disk block and move
    # to a paid plan if history has to survive.
    envVars:
      - key: S13_HOST
        value: 0.0.0.0
      - key: S13_DATA_DIR
        value: /data
      - key: S13_SANDBOX_ROOT
        value: /data/sandbox
      - key: S13_GATEWAY_PROVIDER
        value: gemini
      - key: S13_MAX_TOKENS
        value: "2000"
      # No Ollama process exists in this container. Without this, the first
      # question asked crashes with a 500 the moment the run tries to embed
      # the inbound episode into memory.
      - key: S13_EMBEDDER
        value: deterministic
      # Public hostname (see the note at the top of this file for why this
      # isn't `fromService`). Update this if the gateway service is ever
      # renamed or recreated under a different onrender.com subdomain.
      - key: GLC_BASE_URL
        value: https://glc-gateway.onrender.com
      # DuckDuckGo's scraping endpoint (the default, no key needed) is
      # unreachable from this platform's egress network -- ConnectTimeout on
      # every research call. Set in the Render dashboard, never in the repo.
      # Get a free key at tavily.com; unset, web_search() falls back to
      # DuckDuckGo exactly as before.
      - key: TAVILY_API_KEY
        sync: false
